; Le code ne change pas dans une image construite : opcache peut travailler à
; plein régime et cesser de vérifier les dates de modification des fichiers.
opcache.enable=1
opcache.validate_timestamps=0
opcache.memory_consumption=64
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=20000

; Aucune requête ne transporte de fichier : les séances et leurs journaux sont
; de petits formulaires.
upload_max_filesize=2M
post_max_size=2M

memory_limit=256M
expose_php=Off
