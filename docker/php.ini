; Le code ne change pas dans une image construite : opcache peut travailler à
; plein régime et cesser de vérifier les dates de modification des fichiers.
opcache.enable=1
opcache.validate_timestamps=0
opcache.memory_consumption=64
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=20000

; Fichiers envoyés : le son personnel du compte à rebours (2 Mo au plus) et
; les photos de progression (8 Mo au plus), vérifiés par l'application ; un
; peu de marge pour l'enveloppe.
upload_max_filesize=9M
post_max_size=10M

memory_limit=256M
expose_php=Off
