# Pile de production alimentée par une image déjà construite, récupérée depuis le
# registre. Le serveur ne compile rien : il économise le pic de mémoire du build et
# la bascule ne prend que quelques secondes.
#
# Le registre (compose.registry.yaml du projet pointage) tourne sur cette même
# machine, en boucle locale : "localhost:5000" désigne donc ici le registre du
# VPS, pas celui de la CI.
#
# L'application ne détient pas les ports 80/443 : c'est le Traefik du serveur
# (compose.proxy.yaml de pointage) qui termine le TLS et la joint par le réseau
# « proxy ». Elle sert donc du HTTP simple (SERVER_NAME=:80) et fait confiance
# aux en-têtes X-Forwarded-* de ce seul réseau — TRUSTED_PROXIES dans le .env.
#
# La CI passe l'empreinte exacte à déployer :
#   SPORTS_IMAGE=localhost:5000/sports:<sha> \
#     docker compose -f compose.deploy.yaml up -d
#
# Deux conteneurs seulement : l'application et sa base. Les minuteurs vivent
# dans le navigateur ; ni file d'attente, ni planificateur, ni temps réel.

# Nom de projet figé : les volumes ne dépendent pas du nom du dossier, qui pourrait
# être renommé sans qu'on veuille perdre la base.
name: sports

services:
    app:
        image: '${SPORTS_IMAGE:-localhost:5000/sports:latest}'
        restart: unless-stopped
        env_file: .env
        environment:
            # HTTP simple : le TLS est l'affaire du proxy.
            SERVER_NAME: ':80'
            MIGRATE_ON_BOOT: 'true'
        labels:
            traefik.enable: 'true'
            traefik.http.routers.sports.rule: 'Host(`${APP_DOMAIN}`)'
            traefik.http.routers.sports.entrypoints: 'websecure'
            traefik.http.routers.sports.tls.certresolver: 'le'
            traefik.http.services.sports.loadbalancer.server.port: '80'
        volumes:
            - storage:/app/storage
        networks:
            - default
            - proxy
        depends_on:
            mysql:
                condition: service_healthy

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD}'
        # Quelques séances et leurs journaux : réglages serrés pour cohabiter avec
        # pointage et Drop Picture sur la même machine.
        command:
            - '--innodb-buffer-pool-size=32M'
            - '--performance-schema=OFF'
            - '--innodb-flush-method=O_DIRECT'
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-p${DB_PASSWORD}']
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 40s

networks:
    # Créé une fois pour toutes avec le proxy — voir compose.proxy.yaml de pointage.
    proxy:
        external: true

volumes:
    mysql-data:
    storage:
